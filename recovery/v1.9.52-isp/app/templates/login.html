<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{APP_VERSION}}">
</head>
<body style="background:#1e2a3a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
    <div class="card" style="width:360px;max-width:92vw;">
        <div class="card-header" style="text-align:center;font-size:18px;font-weight:600;">
            🔐 {{ app_name }}
        </div>
        <div class="card-body">
            <div id="loginError" style="color:#e74c3c;font-size:13px;margin-bottom:10px;display:none;"></div>
            <div class="form-group">
                <label>账号</label>
                <input type="text" class="form-control" id="login-user" placeholder="管理员账号" autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-control" id="login-pass" placeholder="密码">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">登录</button>
            <div style="font-size:12px;color:#999;margin-top:12px;text-align:center;line-height:1.6;">
                首次启动账号：<code>admin</code><br>
                随机初始密码保存在数据目录的 <code>initial_admin_password.txt</code>；登录并修改密码后该文件会自动删除
            </div>
        </div>
    </div>
    <script>
    async function doLogin() {
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value;
        const err = document.getElementById('loginError');
        err.style.display = 'none';
        if (!user) { err.textContent = '请输入账号'; err.style.display = 'block'; return; }
        try {
            const r = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            if (r.ok) {
                window.location.href = '/';
            } else {
                let msg = '账号或密码错误';
                try { const j = await r.json(); if (j.detail) msg = j.detail; } catch (e) {}
                err.textContent = msg;
                err.style.display = 'block';
            }
        } catch (e) {
            err.textContent = '登录请求失败：' + e.message;
            err.style.display = 'block';
        }
    }
    document.getElementById('login-pass').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
    });
    </script>
</body>
</html>
