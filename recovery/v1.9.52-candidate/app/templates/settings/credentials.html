<!-- Credential Profiles -->
<div class="card" style="margin-top: 20px;">
    <div class="card-header">
        凭据配置 (Credential Profiles)
        <button class="btn btn-sm btn-primary" onclick="showAddProfileModal()">➕ 添加凭据</button>
    </div>
    <div class="card-body">
        <div style="margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; font-size: 13px; color: #666;">
            为不同设备类型预配置SSH凭据（用户名/密码/端口/出口网卡）。批量发现自动添加设备时，系统会根据推断的设备类型自动匹配对应的凭据。<br>
            <strong>优先级：</strong>设备类型匹配的凭据配置 &gt; 源设备的账号密码<br>
            <strong>自动分组：</strong>发现的设备会自动按设备类型创建分组（如"Cisco IOS 交换机"、"Cisco WLC 控制器"等）
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>设备类型</th>
                        <th>用户名</th>
                        <th>端口</th>
                        <th>出口网卡</th>
                        <th>密码</th>
                        <th>说明</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="profileTable">
                    <tr><td colspan="8" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
