<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f2f5f"><title>登录 · {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{APP_VERSION}}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-intro" aria-label="平台简介">
            <div class="login-brand"><span>CN</span>{{ app_name }}</div>
            <div class="login-message">
                <p class="eyebrow">NETWORK OPERATIONS CENTER</p>
                <h1>让网络资产、地址与配置<br>始终清晰可控</h1>
                <p>面向内网单机与中小规模场景的一体化运维工作台。</p>
                <div class="login-features"><span>设备与拓扑</span><span>IPAM 与 ISP</span><span>配置备份</span><span>平台集成</span></div>
            </div>
            <div class="login-version">安全访问 · v{{ APP_VERSION }}</div>
        </section>
        <section class="login-panel">
            <div class="login-card">
                <div class="login-card-heading"><span class="login-lock" aria-hidden="true">⌾</span><div><h2>欢迎回来</h2><p>使用平台账号继续进入管理控制台</p></div></div>
                <div id="loginError" class="form-alert form-alert-danger" role="alert" hidden></div>
                <div class="form-group"><label for="login-user">账号</label><input type="text" class="form-control form-control-lg" id="login-user" placeholder="请输入管理员账号" autocomplete="username" autofocus></div>
                <div class="form-group"><label for="login-pass">密码</label><div class="password-field"><input type="password" class="form-control form-control-lg" id="login-pass" placeholder="请输入密码" autocomplete="current-password"><button id="togglePassword" class="password-toggle" type="button" aria-label="显示密码">显示</button></div></div>
                <button class="btn btn-primary btn-lg login-submit" id="loginSubmit" type="button" onclick="doLogin()">登录平台</button>
                <p class="login-help">首次启动账号为 <code>admin</code>。随机初始密码保存在数据目录的 <code>initial_admin_password.txt</code>，修改密码后会自动删除。</p>
            </div>
        </section>
    </main>
    <script>
    async function doLogin() {
        const user = document.getElementById('login-user').value.trim(); const pass = document.getElementById('login-pass').value;
        const err = document.getElementById('loginError'); const submit = document.getElementById('loginSubmit'); err.hidden = true;
        if (!user) { err.textContent = '请输入账号'; err.hidden = false; return; }
        submit.disabled = true; submit.textContent = '正在登录…';
        try {
            const r = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
            if (r.ok) { window.location.href = '/'; return; }
            let msg = '账号或密码错误'; try { const j = await r.json(); if (j.detail) msg = j.detail; } catch (e) {}
            err.textContent = msg; err.hidden = false;
        } catch (e) { err.textContent = '登录请求失败：' + e.message; err.hidden = false; }
        finally { submit.disabled = false; submit.textContent = '登录平台'; }
    }
    document.getElementById('login-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    document.getElementById('togglePassword').addEventListener('click', function () { const field = document.getElementById('login-pass'); const visible = field.type === 'text'; field.type = visible ? 'password' : 'text'; this.textContent = visible ? '显示' : '隐藏'; this.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码'); });
    </script>
</body>
</html>
