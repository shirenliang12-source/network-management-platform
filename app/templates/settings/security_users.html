<!-- Web 登录口令 -->
<div class="card" style="margin-top: 20px;">
    <div class="card-header">🔐 Web 登录口令（访问本系统的账号密码）</div>
    <div class="card-body">
        <div style="margin-bottom: 12px; padding: 10px; background: #f8f9fa; border-radius: 6px; font-size: 13px; color: #666;">
            登录鉴权为<strong>强制开启（不可关闭）</strong>。首次启动会为 <code>admin</code> 生成随机密码，并保存到数据目录的 <code>initial_admin_password.txt</code>；修改密码后该文件会自动删除。<br>
            密码至少 12 个字符；修改账号后当前会话会同步更新。
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="flex:1;min-width:200px;"><label>当前密码 *</label><input type="password" class="form-control" id="wa-cur" placeholder="用于确认身份"></div>
            <div class="form-group" style="flex:1;min-width:200px;"><label>新账号</label><input type="text" class="form-control" id="wa-user" placeholder="留空则不修改账号"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="flex:1;min-width:200px;"><label>新密码</label><input type="password" class="form-control" id="wa-pass" placeholder="至少 12 个字符；留空则不修改"></div>
            <div class="form-group" style="flex:1;min-width:200px;"><label>确认新密码</label><input type="password" class="form-control" id="wa-conf" placeholder="再次输入新密码"></div>
        </div>
        <div style="margin-top:6px;">
            <button class="btn btn-primary" onclick="saveWebAuth()">保存 Web 登录口令</button>
            <span id="wa-status" style="margin-left:10px;font-size:13px;"></span>
        </div>
    </div>
</div>

<!-- 用户管理（仅超级管理员可见）-->
<div class="card" id="userMgmtCard" style="margin-top: 20px; display:none;">
    <div class="card-header">👤 用户管理（管理账号 / 模块权限）
        <button class="btn btn-sm btn-primary" onclick="showAddUserModal()">➕ 新增账号</button>
    </div>
    <div class="card-body">
        <div style="margin-bottom:12px;padding:10px;background:#f8f9fa;border-radius:6px;font-size:13px;color:#666;">
            超级管理员拥有<strong>全部模块</strong>权限；普通账号仅能访问被勾选的功能模块。至少需保留一个超级管理员。
        </div>
        <table class="table" id="userTable">
            <thead><tr><th>账号</th><th>角色</th><th>状态</th><th>授权模块</th><th>操作</th></tr></thead>
            <tbody id="userTbody"></tbody>
        </table>
    </div>
</div>
